[supervisord]
 nodaemon=true

[program:nginx]
 command=/usr/sbin/nginx -g 'daemon off;'
 autostart=true
 autorestart=true

[program:fras]
command=uvicorn main:app --host 127.0.0.1 --port 7861
directory=/var/www/fras
environment=PYTHONPATH="/var/www/fras",SCRIPT_NAME="/fras"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:portfolio]
 command=serve -s /var/www/portfolio -l 3000
 autostart=true
 autorestart=true