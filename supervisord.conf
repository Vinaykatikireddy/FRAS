[supervisord]
 nodaemon=true

[program:nginx]
 command=/usr/sbin/nginx -g 'daemon off;'
 autostart=true
 autorestart=true

[program:fras]
command=uvicorn main:app --host 127.0.0.1 --port 7861 --root-path /fras/api
directory=/var/www/fras
environment=PYTHONPATH="/var/www/fras"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0