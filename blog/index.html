<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog | Vinay</title>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        body {
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
            font-family: Arial, sans-serif;
            line-height: 1.7;
            background: #111;
            color: #eee;
        }

        img {
            max-width: 100%;
            border-radius: 8px;
        }

        a {
            color: #4da6ff;
        }

        pre {
            background: #222;
            padding: 15px;
            overflow-x: auto;
            border-radius: 8px;
        }

        code {
            font-family: monospace;
        }
    </style>
</head>
<body>

<h1>Blog</h1>

<div id="content">Loading...</div>

<script>
const params = new URLSearchParams(window.location.search);
const post = params.get("post") || "hello-world";

fetch(`${post}.md`)
    .then(r => r.text())
    .then(md => {
        document.getElementById("content").innerHTML =
            marked.parse(md);
    })
    .catch(() => {
        document.getElementById("content").innerHTML =
            "<h2>Post not found.</h2>";
    });
</script>

</body>
</html>
